<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon-96x96.png" sizes="96x96" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<meta name="theme-color" content="#1a24df" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (English)" href="/en/feed.xml" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (Tiếng Việt)" href="/vi/feed.xml" />
		<link
			rel="preload"
			href="/fonts/cda-independence/CDAIndependenceText-Regular.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/cda-independence/CDAIndependenceDisplay-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
		<script>
			// The two reading preferences, applied before first paint — a theme or
			// a text size settled after hydration would repaint the page under the
			// reader's eyes. This duplicates `$lib/reading-prefs` on purpose: it
			// runs before any module loads. Keep the keys and the steps in step.
			//
			// With no theme on record nothing is stamped, so the CSS follows
			// `prefers-color-scheme`. `dusk` no longer exists and reads as light.
			try {
				var d = document.documentElement,
					t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dusk') d.dataset.theme = 'light';
				else if (t === 'dark') d.dataset.theme = 'dark';

				var fs = parseFloat(localStorage.getItem('font-size'));
				if (fs) {
					fs = fs < 17.5 ? 17 : fs < 19 ? 18 : 20;
					if (fs !== 18) d.style.setProperty('--reading-fs', fs + 'px');
				}
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
