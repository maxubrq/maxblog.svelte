<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon-96x96.png" sizes="96x96" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<meta name="theme-color" content="#1a24df" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (English)" href="/en/feed.xml" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (Tiếng Việt)" href="/vi/feed.xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			// Reading preferences, applied before first paint. Everything settled
			// here changes a colour or a width, and settling it after hydration
			// would repaint or reflow the page under the reader's eyes.
			//
			// This duplicates `$lib/reading-prefs` on purpose: it has to run before
			// any module loads, so it cannot import. Keep the two in step — the
			// keys, the allowed values and the defaults are the contract.
			try {
				var d = document.documentElement,
					g = function (k) {
						return localStorage.getItem(k);
					},
					one = function (k, allowed, fallback) {
						var v = g(k);
						return allowed.indexOf(v) >= 0 ? v : fallback;
					};

				// The theme is the one thing that may go unstamped: with no choice
				// on record the CSS follows `prefers-color-scheme`, and writing an
				// attribute here would take that away.
				if (g('theme-auto') === 'true') {
					var h = new Date().getHours();
					d.dataset.theme = h >= 6 && h < 17 ? 'light' : h < 20 ? 'dusk' : 'dark';
				} else {
					var t = g('theme');
					if (t === 'light' || t === 'dusk' || t === 'dark') d.dataset.theme = t;
				}

				d.dataset.layout = one('layout', ['single', 'sidenote'], 'sidenote');
				d.dataset.framing = one('framing', ['rule', 'bleed', 'card'], 'card');
				d.dataset.readingMode = one('reading-mode', ['study', 'flow'], 'study');
				d.dataset.measure = one('measure', ['52', '60', '72'], '60');
				d.dataset.typeface = one('typeface', ['sans', 'serif'], 'sans');
				if (g('reading-ruler') === 'true') d.dataset.ruler = 'on';

				var fs = parseFloat(g('font-size'));
				if (fs >= 16 && fs <= 26) d.style.setProperty('--reading-fs', fs + 'px');
				var lh = parseFloat(g('line-spacing'));
				if (lh >= 1.4 && lh <= 2.2) d.style.setProperty('--reading-lh', lh);
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
