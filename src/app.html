<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon/favicon-96x96.png" sizes="96x96" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<meta name="theme-color" content="#1a24df" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (English)" href="/en/feed.xml" />
		<link rel="alternate" type="application/rss+xml" title="maxubrq (Tiếng Việt)" href="/vi/feed.xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<script>
			// Reading preferences, applied before first paint so the page never
			// flashes the wrong paper. Only a *stored* theme is stamped: with no
			// choice on record the CSS follows the system setting.
			try {
				var d = document.documentElement,
					g = function (k) {
						return localStorage.getItem(k);
					},
					t = g('theme');
				if (t === 'light' || t === 'dusk' || t === 'dark') d.dataset.theme = t;
				d.dataset.layout = g('layout') === 'single' ? 'single' : 'sidenote';
				var f = g('framing');
				d.dataset.framing = f === 'rule' || f === 'bleed' ? f : 'card';
				// Reading mode decides the width of the column, so it has to be
				// stamped here — settling it after hydration would reflow the
				// article under the reader's eyes.
				d.dataset.readingMode = g('reading-mode') === 'flow' ? 'flow' : 'study';
				if (g('reading-ruler') === 'true') d.dataset.ruler = 'on';
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
