<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>maxubrq — blog designs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: "IBM Plex Sans", -apple-system, sans-serif; }
  /* Slider restyle for the sim (scoped) */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--rule); border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: grab; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: grab; border: none;
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#faf8f4">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#faf8f4"/>
    <text x="600" y="420" font-family="Georgia, serif" font-size="220" font-weight="500"
      letter-spacing="-6" text-anchor="middle" fill="#1a1814">m.</text>
    <line x1="500" y1="500" x2="700" y2="500" stroke="#c96442" stroke-width="4"/>
    <text x="600" y="560" font-family="monospace" font-size="28" letter-spacing="4"
      text-anchor="middle" fill="#1a1814" opacity="0.6">MAXUBRQ</text>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="pages/ArticlePage.jsx"></script>
<script type="text/babel" src="pages/OtherPages.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Tweaks panel ────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "fontPair": "newsreader",
  "layout": "single",
  "framing": "card"
}/*EDITMODE-END*/;

function TweaksPanel({ values, onChange, visible }) {
  if (!visible) return null;
  const Row = ({ label, children }) => (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, letterSpacing: 0.8,
        textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)' }}>{label}</div>
      <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>{children}</div>
    </div>
  );
  const Chip = ({ active, onClick, children }) => (
    <button onClick={onClick} style={{
      border: '1px solid rgba(255,255,255,0.15)',
      background: active ? '#fff' : 'transparent',
      color: active ? '#1a1814' : '#e8e4dc',
      fontFamily: '"IBM Plex Sans", sans-serif', fontSize: 12, fontWeight: active ? 500 : 400,
      padding: '5px 10px', borderRadius: 2, cursor: 'pointer', letterSpacing: 0.1,
    }}>{children}</button>
  );

  return (
    <div style={{
      position: 'fixed', right: 20, bottom: 20, width: 260,
      background: '#1a1814', color: '#e8e4dc', zIndex: 1000,
      padding: 18, borderRadius: 4, boxShadow: '0 12px 40px rgba(0,0,0,0.3)',
      fontFamily: '"IBM Plex Sans", sans-serif',
    }}>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 11, letterSpacing: 1,
        textTransform: 'uppercase', marginBottom: 16, opacity: 0.7 }}>Tweaks</div>

      <Row label="Theme">
        <Chip active={values.theme === 'light'} onClick={() => onChange({ theme: 'light' })}>Light</Chip>
        <Chip active={values.theme === 'dark'} onClick={() => onChange({ theme: 'dark' })}>Dark</Chip>
      </Row>
      <Row label="Type pairing">
        <Chip active={values.fontPair === 'newsreader'} onClick={() => onChange({ fontPair: 'newsreader' })}>Newsreader</Chip>
        <Chip active={values.fontPair === 'source'} onClick={() => onChange({ fontPair: 'source' })}>Source Serif</Chip>
        <Chip active={values.fontPair === 'lora'} onClick={() => onChange({ fontPair: 'lora' })}>Lora</Chip>
        <Chip active={values.fontPair === 'garamond'} onClick={() => onChange({ fontPair: 'garamond' })}>Garamond</Chip>
      </Row>
      <Row label="Layout">
        <Chip active={values.layout === 'single'} onClick={() => onChange({ layout: 'single' })}>Single column</Chip>
        <Chip active={values.layout === 'sidenote'} onClick={() => onChange({ layout: 'sidenote' })}>Margin notes</Chip>
      </Row>
      <Row label="Interactive framing">
        <Chip active={values.framing === 'rule'} onClick={() => onChange({ framing: 'rule' })}>Hair rule</Chip>
        <Chip active={values.framing === 'bleed'} onClick={() => onChange({ framing: 'bleed' })}>Full bleed</Chip>
        <Chip active={values.framing === 'card'} onClick={() => onChange({ framing: 'card' })}>Inset card</Chip>
      </Row>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, color: 'rgba(255,255,255,0.4)',
        marginTop: 8, lineHeight: 1.4 }}>
        Applies to the Article artboard. Focus any artboard with the ↗ icon.
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <DCSection id="primary" title="maxubrq · blog" subtitle="Reading-first. Interactive-ready. Vietnamese-safe type.">
          <DCArtboard id="article" label="Article — the reading surface" width={1200} height={820}>
            <ArticlePage theme={tweaks.theme} fontPair={tweaks.fontPair} layout={tweaks.layout} framing={tweaks.framing} />
          </DCArtboard>
          <DCArtboard id="home" label="Home" width={960} height={820}>
            <HomePage />
          </DCArtboard>
          <DCArtboard id="index" label="Archive" width={960} height={820}>
            <IndexPage />
          </DCArtboard>
          <DCArtboard id="about" label="About" width={760} height={820}>
            <AboutPage />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel values={tweaks} onChange={update} visible={tweaksVisible} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
