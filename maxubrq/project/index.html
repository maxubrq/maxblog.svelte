<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>maxubrq — blog designs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { font-family: "IBM Plex Sans", -apple-system, sans-serif; }
  /* Slider restyle for the sim (scoped) */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 1px; background: var(--rule);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); cursor: grab; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); cursor: grab; border: none;
  }
  ::selection { background: var(--accent); color: var(--paper); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="pages/PrintMode.jsx"></script>
<script type="text/babel" src="pages/Engagement.jsx"></script>
<script type="text/babel" src="pages/ReadingExtras.jsx"></script>
<script type="text/babel" src="pages/Glossary.jsx"></script>
<script type="text/babel" src="pages/Topics.jsx"></script>
<script type="text/babel" src="pages/Series.jsx"></script>
<script type="text/babel" src="pages/ReadingMemory.jsx"></script>
<script type="text/babel" src="pages/MarginQuestion.jsx"></script>
<script type="text/babel" src="pages/Companion.jsx"></script>
<script type="text/babel" src="pages/Constellation.jsx"></script>
<script type="text/babel" src="pages/FairWitness.jsx"></script>
<script type="text/babel" src="pages/SignalsDashboard.jsx"></script>
<script type="text/babel" src="pages/Search.jsx"></script>
<script type="text/babel" src="pages/TechPrimitives.jsx"></script>
<script type="text/babel" src="pages/TechArticlePage.jsx"></script>
<script type="text/babel" src="pages/ArticlePage.jsx"></script>
<script type="text/babel" src="pages/LongFormPage.jsx"></script>
<script type="text/babel" src="pages/PrintPreview.jsx"></script>
<script type="text/babel" src="pages/OtherPages.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── Tweaks panel ────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "palette": "slate",
  "fontPair": "newsreader",
  "layout": "sidenote",
  "framing": "card"
}/*EDITMODE-END*/;

function TweaksPanel({ values, onChange, visible }) {
  if (!visible) return null;
  const Row = ({ label, children }) => (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 14 }}>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, letterSpacing: 0.8,
        textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)' }}>{label}</div>
      <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>{children}</div>
    </div>
  );
  const Chip = ({ active, onClick, children }) => (
    <button onClick={onClick} style={{
      border: '1px solid rgba(255,255,255,0.15)',
      background: active ? '#fff' : 'transparent',
      color: active ? '#1a1814' : '#e8e4dc',
      fontFamily: '"IBM Plex Sans", sans-serif', fontSize: 12, fontWeight: active ? 500 : 400,
      padding: '5px 10px', borderRadius: 2, cursor: 'pointer', letterSpacing: 0.1,
    }}>{children}</button>
  );

  return (
    <div style={{
      position: 'fixed', right: 20, bottom: 20, width: 260,
      background: '#1a1814', color: '#e8e4dc', zIndex: 1000,
      padding: 18, borderRadius: 4, boxShadow: '0 12px 40px rgba(0,0,0,0.3)',
      fontFamily: '"IBM Plex Sans", sans-serif',
    }}>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 11, letterSpacing: 1,
        textTransform: 'uppercase', marginBottom: 16, opacity: 0.7 }}>Tweaks</div>

      <Row label="Theme">
        <Chip active={values.theme === 'light'} onClick={() => onChange({ theme: 'light' })}>Light</Chip>
        <Chip active={values.theme === 'dark'} onClick={() => onChange({ theme: 'dark' })}>Dark</Chip>
      </Row>
      <Row label="Palette">
        <Chip active={values.palette === 'warm'} onClick={() => onChange({ palette: 'warm' })}>Warm · terracotta</Chip>
        <Chip active={values.palette === 'ink'} onClick={() => onChange({ palette: 'ink' })}>Ink · cool blue</Chip>
        <Chip active={values.palette === 'prussian'} onClick={() => onChange({ palette: 'prussian' })}>Prussian · deep blue</Chip>
        <Chip active={values.palette === 'slate'} onClick={() => onChange({ palette: 'slate' })}>Slate · modern blue</Chip>
        <Chip active={values.palette === 'oxford'} onClick={() => onChange({ palette: 'oxford' })}>Oxford · ivory + navy</Chip>
      </Row>
      <Row label="Type pairing">
        <Chip active={values.fontPair === 'newsreader'} onClick={() => onChange({ fontPair: 'newsreader' })}>Newsreader</Chip>
        <Chip active={values.fontPair === 'source'} onClick={() => onChange({ fontPair: 'source' })}>Source Serif</Chip>
        <Chip active={values.fontPair === 'lora'} onClick={() => onChange({ fontPair: 'lora' })}>Lora</Chip>
        <Chip active={values.fontPair === 'garamond'} onClick={() => onChange({ fontPair: 'garamond' })}>Garamond</Chip>
      </Row>
      <Row label="Layout">
        <Chip active={values.layout === 'single'} onClick={() => onChange({ layout: 'single' })}>Single column</Chip>
        <Chip active={values.layout === 'sidenote'} onClick={() => onChange({ layout: 'sidenote' })}>Margin notes</Chip>
      </Row>
      <Row label="Interactive framing">
        <Chip active={values.framing === 'rule'} onClick={() => onChange({ framing: 'rule' })}>Hair rule</Chip>
        <Chip active={values.framing === 'bleed'} onClick={() => onChange({ framing: 'bleed' })}>Full bleed</Chip>
        <Chip active={values.framing === 'card'} onClick={() => onChange({ framing: 'card' })}>Inset card</Chip>
      </Row>
      <div style={{ fontFamily: '"IBM Plex Mono", monospace', fontSize: 10, color: 'rgba(255,255,255,0.4)',
        marginTop: 8, lineHeight: 1.4 }}>
        Applies to the Article artboard. Focus any artboard with the ↗ icon.
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  return (
    <>
      <DesignCanvas>
        <DCSection id="primary" title="maxubrq · blog" subtitle="Reading-first. Interactive-ready. Vietnamese-safe type.">
          <DCArtboard id="article" label="Article — the reading surface" width={1200} height={820}>
            <ArticlePage theme={tweaks.theme} palette={tweaks.palette} fontPair={tweaks.fontPair} layout={tweaks.layout} framing={tweaks.framing} />
          </DCArtboard>
          <DCArtboard id="home" label="Home" width={960} height={820}>
            <HomePage palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="index" label="Archive" width={960} height={820}>
            <IndexPage palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="about" label="About" width={760} height={820}>
            <AboutPage palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="search" title="Universal search" subtitle="⌘K anywhere. A library index card drawer, not a modal.">
          <DCArtboard id="search-idle" label="Search — idle / suggestions" width={1200} height={720}>
            <UniversalSearch palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="search-results" label="Search — results for ‘pendulum’" width={1200} height={720}>
            <SearchSeeded palette={tweaks.palette} theme={tweaks.theme} q="pendulum" />
          </DCArtboard>
          <DCArtboard id="search-marks" label="Search — scope: My marks" width={1200} height={720}>
            <SearchSeeded palette={tweaks.palette} theme={tweaks.theme} q="read" scope="marks" />
          </DCArtboard>
        </DCSection>
        <DCSection id="tech" title="Technical writing" subtitle="Code plates, diagrams, terminals, callouts — all aligned to the book grid.">
          <DCArtboard id="tech-article" label="Technical post — debounce, rebuilt" width={1200} height={820}>
            <TechArticlePage theme={tweaks.theme} palette={tweaks.palette} fontPair={tweaks.fontPair} />
          </DCArtboard>
        </DCSection>
        <DCSection id="listening" title="Listening surface" subtitle="Quiet capture for readers — rich signal for the author.">
          <DCArtboard id="signals" label="Reader signals — author-only dashboard" width={1100} height={820}>
            <SignalsDashboard palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="glossary" title="Interactive glossary" subtitle="Inline marks, per-post footnote, site-level dictionary.">
          <DCArtboard id="glossary-page" label="Glossary — the site-level dictionary" width={1080} height={820}>
            <GlossaryPage palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="topics" title="Topic pages" subtitle="Four curated doorways. Each begins with an editor's note.">
          <DCArtboard id="topics-hub" label="Topics — the hub" width={1080} height={820}>
            <TopicsHub palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="topic-science" label="Topic — Science" width={1080} height={820}>
            <TopicPage topic="science" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="topic-software" label="Topic — Software" width={1080} height={820}>
            <TopicPage topic="software" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="topic-philosophy" label="Topic — Philosophy" width={1080} height={820}>
            <TopicPage topic="philosophy" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="topic-art" label="Topic — Art" width={1080} height={820}>
            <TopicPage topic="art" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="series" title="Series" subtitle="Volumes & chapters. Some closed, some still being written.">
          <DCArtboard id="series-shelf" label="Series — the shelf" width={1080} height={820}>
            <SeriesShelf palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="series-ts" label="Series — TypeScript for the Strong Engineer" width={1080} height={820}>
            <SeriesPage seriesId="ts" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="series-philo" label="Series — How I Learn Philosophy" width={1080} height={820}>
            <SeriesPage seriesId="philo" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="series-math" label="Series — Mathematics for Developers (closed)" width={1080} height={820}>
            <SeriesPage seriesId="math" palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="memory" title="Reading memory" subtitle="“You were here.” A soft return for half-read posts. Never a modal.">
          <DCArtboard id="memory-article" label="Article — masthead nudge + gutter glyph" width={1080} height={820}>
            <ArticleWithMemory palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="memory-home" label="Home — pick up where you left off" width={1080} height={820}>
            <HomeWithMemory palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="memory-archive" label="Archive — half-read posts marked" width={1080} height={820}>
            <ArchiveWithMemory palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="witness" title="✦ Magic — the fair-witness drawer" subtitle="The crowd, but only after you've finished. Quiet, single-column, never a dashboard.">
          <DCArtboard id="witness-invite" label="The invitation — drawer just opened at the end-mark" width={1080} height={820}>
            <WitnessInvite palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="witness-drawer" label="The drawer open — count, pull-quote, retention, passages, ribbons, letters" width={1200} height={820}>
            <WitnessDrawer palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="witness-consent" label="Per-mark consent chip — share with the witness?" width={1200} height={820}>
            <WitnessConsent palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="margin-q" title="Margin questions" subtitle="A pause to think, never a test. One example, designed deeply.">
          <DCArtboard id="mq-article" label="Article — debounce, with a pause" width={1080} height={820}>
            <ArticleWithMarginQuestion palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="long-form" title="Super long-form (8k+)" subtitle="An 8,000-word essay must read like a book, not a scroll. Front matter, named movements, journey rail, pulse, interlude, recurrence marks, resumption, personal index.">
          <DCArtboard id="long-form-fresh" label="Long-form — first read (front matter + movements + journey rail)" width={1280} height={900}>
            <LongFormPage theme={tweaks.theme} palette={tweaks.palette} fontPair={tweaks.fontPair} variant="fresh" />
          </DCArtboard>
          <DCArtboard id="long-form-resume" label="Long-form — coming back (resumption banner, deep in Movement III)" width={1280} height={900}>
            <LongFormPage theme={tweaks.theme} palette={tweaks.palette} fontPair={tweaks.fontPair} variant="resume" />
          </DCArtboard>
          <DCArtboard id="long-form-print" label="Long-form — print preview (book spreads)" width={1280} height={1900}>
            <PrintPreview theme={tweaks.theme} palette={tweaks.palette} fontPair={tweaks.fontPair} />
          </DCArtboard>
        </DCSection>
        <DCSection id="constellation" title="✦ Constellation — a chart of your reading" subtitle="Plate XII. An etched chart that only exists because you've been here. Your reading order is the ember thread; author citations are engraved; witness kinship is dotted.">
          <DCArtboard id="constellation-plate" label="Plate XII — the reader's sky (returning reader)" width={1280} height={1480}>
            <ConstellationPage palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
        <DCSection id="companion" title="✦ The Companion (M2)" subtitle="A margin AI that has read everything you wrote. Refuses to invent.">
          <DCArtboard id="comp-ask" label="Companion — the ask, mid-thought" width={1100} height={820}>
            <CompanionAsk palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="comp-answer" label="Companion — the answer, with citations" width={1100} height={820}>
            <CompanionAnswer palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
          <DCArtboard id="comp-refusal" label="Companion — the honest refusal" width={1100} height={820}>
            <CompanionRefusal palette={tweaks.palette} theme={tweaks.theme} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel values={tweaks} onChange={update} visible={tweaksVisible} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
